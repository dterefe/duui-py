          type: integer
          current: 2
    legacy_lua_json:
      source_file: duui-py/examples/gnfinder-async/gnfinder_legacy_annotator.py
      codec: lua_custom_json
      backend:
        shared_with_async_msgpack: true
      request_parameters:
        language:
