          env: GNFINDER_API_PORT
          default: 18999
        args:
          current: ["-p", "${gnfinder_backend_port}"]
        ping_path:
          current: /api/v1/ping
        startup_timeout_seconds:
          parameter: gnfinder_startup_timeout
