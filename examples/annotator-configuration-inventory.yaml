version: 1
generated_for: duui-py example annotator evaluation
generated_on: 2026-06-10
scope:
  directories:
    - duui-py/examples/gazetteer-async
    - duui-py/examples/gnfinder-async
    - duui-py/examples/spacy-async
    - duui-py/examples/taxonerd-async
  variants:
    - legacy_lua_json_baseline
    - msgpack_lua_async
  policy:
    fixed_annotator_worker_defaults: removed_from_example_dockerfiles
    backend_worker_defaults: omitted_unless_configured
    model_changes: out_of_scope
    typesystem_changes: out_of_scope
    descriptor_exposure: performance_relevant_request_and_backend_knobs_only
    excluded_from_descriptor:
      - container_internal_bind_host
      - container_internal_bind_port
      - fixed_backend_ping_paths
      - fixed_output_type_names
      - mime_validation_policy
      - telemetry_service_storage_limits

descriptor_runtime_exclusions:
  container_runtime:
    source_files:
      - duui-py/examples/gazetteer-async/Dockerfile
      - duui-py/examples/gnfinder-async/Dockerfile
      - duui-py/examples/spacy-async/Dockerfile
      - duui-py/examples/taxonerd-async/Dockerfile
    reason: Container bind host/port and image entrypoint wiring are deployment concerns, not annotator performance semantics. The descriptor now exposes only request/backend knobs that change runtime cost or result-query behavior.

descriptor_parameter_surface:
  source:
    model: duui-py/src/duui_py/models/config.py
    endpoints:
      - /v1/details/input_output
      - /v1/documentation
  rule: AnnotatorDescriptor.parameters carries the performance-relevant schema. AnnotatorConfig mirrors legacy root parameters_schema into the descriptor and descriptor.parameters back to parameters_schema when loading older or static configs.

shared_duui_py_descriptor_settings:
  source_files:
    - duui-py/examples/gnfinder-async/annotator_config.json
    - duui-py/examples/spacy-async/annotator_config.json
    - duui-py/examples/taxonerd-async/annotator_config.json
  validation:
    strict_mime_validation:
      type: boolean
      current: true
    strict_input_mime_check:
      type: boolean
      current: true
    strict_output_mime_check:
      type: boolean
      current: true
    strict_sofa_data_type_validation:
      type: boolean
      current: true
    strict_descriptor_mime_pattern_validation:
      type: boolean
      current: true
  limits:
    request_max_bytes:
      type: integer_or_null
      current: null
    response_max_bytes:
      type: integer_or_null
      current: null
  errors:
    fail_on_codec_error:
      type: boolean
      current: true
    include_validation_details:
      type: boolean
      current: true
  logging:
    enabled:
      type: boolean
      current: true
    stream_timeout_minutes:
      type: number
      current: 5
    max_queue_size:
      type: integer
      current: 1000
    metrics_collection_interval_seconds:
      type: number
      current: 5

