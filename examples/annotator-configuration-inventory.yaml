      default: 10.0
    pool_timeout_seconds:
      type: number
      env: DUUI_HTTP_POOL_TIMEOUT_SECONDS
      default: 5.0
    max_connections:
      type: integer
      env: DUUI_HTTP_MAX_CONNECTIONS
      default: 50
    max_keepalive_connections:
      type: integer
      env: DUUI_HTTP_MAX_KEEPALIVE_CONNECTIONS
      default: 50
    keepalive_expiry_seconds:
      type: number
      env: DUUI_HTTP_KEEPALIVE_EXPIRY_SECONDS
      default: 60.0
    http2:
      type: boolean
      current: auto_if_h2_installed
    headers:
      explicit_shared_headers:
        current: none
