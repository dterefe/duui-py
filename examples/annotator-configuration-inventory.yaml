        retry_count:
          type: integer
          env: DUUI_HTTP_RETRIES
          default: 2
        pool_timeout_seconds:
          type: number
          current: 120.0

  spacy:
    async_msgpack:
      source_file: duui-py/examples/spacy-async/spacy_annotator.py
      codec: msgpack_lua
      model_resolution:
        explicit_model_parameter: model_name
        aliases: [spacy_model, single_model]
        variant_parameter: model_variant
        variant_aliases: [spacy_model_size]
        language_parameter: spacy_language
        language_aliases: [language, lang]
        variants:
          trf:
            de: de_dep_news_trf
            en: en_core_web_trf
          sm:
            de: de_core_news_sm
            en: en_core_web_sm
        preload_env: DUUI_SPACY_PRELOAD_MODEL
        preload_fallback_order:
          - en_core_web_trf_if_installed
          - en_core_web_sm
      request_parameters:
        model_name:
          type: string
          default: en_core_web_trf
        model_variant:
          type: string
          default: trf
          values: [trf, sm]
        spacy_language:
          type: string
          default: en
        exclude:
          type: string_or_list
          default: []
          effect: spacy_load_exclude_components
        spacy_batch_size:
          type: integer
          default: 32
        use_existing_sentences:
          type: boolean
          default: false
        use_existing_tokens:
          type: boolean
          default: false
        spacy_n_process:
          type: integer
          default: 0
          env: SPACY_N_PROCESS
          effect: nlp_pipe_process_count
          zero_means: cpu_count_for_cpu_or_1_for_gpu
        prefer_gpu:
          type: boolean
          default: false
          env_fallbacks:
            - DUUI_PREFER_GPU
            - CUDA_VISIBLE_DEVICES
        disable_pipeline_components:
          type: boolean
          default: true
          effect: disable_components_not_required_by_outputs
        adaptive_batch_size:
          type: boolean
          default: true
          effect: lower_batch_size_for_longer_texts
      procedure_knobs:
        output_set:
          default:
            - tokenizer
            - sentencizer
            - lemmatizer
            - tagger
            - morphologizer
            - parser
            - ner
        pass_through_existing_annotations:
          enabled: true
          required_types_by_output:
            tokenizer: de.tudarmstadt.ukp.dkpro.core.api.segmentation.type.Token
            sentencizer: de.tudarmstadt.ukp.dkpro.core.api.segmentation.type.Sentence
            lemmatizer: de.tudarmstadt.ukp.dkpro.core.api.segmentation.type.Lemma
            tagger: de.tudarmstadt.ukp.dkpro.core.api.lexmorph.type.pos.POS
            morphologizer: de.tudarmstadt.ukp.dkpro.core.api.lexmorph.type.morph.MorphologicalFeatures
            parser:
              - de.tudarmstadt.ukp.dkpro.core.api.syntax.type.dependency.Dependency
              - de.tudarmstadt.ukp.dkpro.core.api.syntax.type.dependency.ROOT
            ner: de.tudarmstadt.ukp.dkpro.core.api.ner.type.NamedEntity
        gpu_memory:
          pytorch_cuda_alloc_conf_append:
            env: DUUI_SPACY_CUDA_MAX_SPLIT_SIZE_MB
            default: max_split_size_mb:128
          cuda_device:
            env: DUUI_SPACY_CUDA_DEVICE
            default: 0
        model_cache:
          lru_cache_maxsize: 4
    legacy_lua_json:
      source_file: duui-py/examples/spacy-async/spacy_legacy_annotator.py
      codec: lua_custom_json
      model_resolution:
        explicit_model_parameter: model_name
        variant_parameter: model_variant
        variant_aliases: [spacy_model_size]
        default_variant: efficiency
        variant_alias_mapping:
          lg: accuracy
          trf: accuracy
          sm: efficiency
        language_mapping:
          x-unspecified: xx
        strict_language_check_parameter: strict_language_check
        variants:
          efficiency:
            de: de_core_news_sm
            en: en_core_web_sm
            fr: fr_core_news_sm
          accuracy:
            de: de_dep_news_trf
            en: en_core_web_trf
            fr: fr_dep_news_trf
          sm:
            de: de_core_news_sm
            en: en_core_web_sm
            fr: fr_core_news_sm
          trf:
            de: de_dep_news_trf
            en: en_core_web_trf
            fr: fr_dep_news_trf
      request_parameters:
        model_variant:
          type: string
          default: efficiency
          values: [efficiency, accuracy]
        model_name:
          type: string
          default: null
        write_types:
          type: list_string_or_json_string
          default: all_textimager_output_types
        use_existing_tokens:
          type: boolean
          default: false
        use_existing_sentences:
          type: boolean
          default: false
        spacy_batch_size:
          type: integer
          default: 32
        strict_language_check:
          type: boolean
          default: false
        spacy_disable:
          type: list_string
          default: []
        prefer_gpu:
          type: boolean
          default: false
      procedure_knobs:
        pretokenized_doc:
          enabled_when: tokens_and_spaces_are_present_and_same_length
        existing_sentence_starts:
          enabled_when: sent_starts_present
        model_cache:
          shared_with_async_msgpack_loader: true

  taxonerd:
    async_msgpack:
      source_files:
        - duui-py/examples/taxonerd-async/taxonerd_annotator.py
        - duui-py/examples/taxonerd-async/_taxonerd_shared.py
      codec: msgpack_lua
      source_policy:
        required_source: github.com/abrami/taxonerd
        source_root_env: DUUI_TAXONERD_SOURCE_ROOT
        source_root_default: /storage/projects/BIOfid/code/dterefe/taxonerd-abrami
      request_parameters:
        model:
          type: string
          default: en_ner_eco_md
          aliases: [model_name]
          alias_mapping:
            biobert: en_ner_eco_biobert
            biobert_weak: en_ner_eco_biobert_weak
            md: en_ner_eco_md
            md_weak: en_ner_eco_md_weak
        linking:
          type: string
          default: gbif_backbone
          aliases: [linker_name]
          alias_mapping:
            gbif: gbif_backbone
            gbif_backbone: gbif_backbone
            taxref: taxref
            ncbi: ncbi_taxonomy
            ncbi_taxonomy: ncbi_taxonomy
            ncbi_lite: ncbi_taxonomy_lite
            ncbi_taxonomy_lite: ncbi_taxonomy_lite
            none: null
            "": null
        prefer_gpu:
          type: boolean
          default: false
          env_fallbacks:
            - DUUI_PREFER_GPU
            - CUDA_VISIBLE_DEVICES
        threshold:
          type: number
          default: 0.7
        exclude:
          type: string_or_list
          default:
            - tagger
            - parser
            - taxo_abbrev_detector
            - taxon_linker
            - pysbd_sentencizer
        allow_unlinked:
          type: boolean
          default: false
          effect: permit_linking_none_without_error
      procedure_knobs:
        strategy:
          current: legacy_find_in_text_procedure
        model_cache:
          lru_cache_maxsize: 4
          key_fields: [model, linker, threshold_rounded_6, exclude_sorted, prefer_gpu]
        runtime_preload:
          model:
            env: DUUI_TAXONERD_PRELOAD_MODEL
            default: en_ner_eco_md
          linker:
            env: DUUI_TAXONERD_PRELOAD_LINKER
            default: gbif_backbone
          threshold:
            env: DUUI_TAXONERD_PRELOAD_THRESHOLD
            default: 0.7
          exclude:
            env: DUUI_TAXONERD_PRELOAD_EXCLUDE
            default:
              - tagger
              - parser
              - taxo_abbrev_detector
              - taxon_linker
              - pysbd_sentencizer
        output_types:
          taxon: org.texttechnologylab.annotation.type.Taxon
          annotation_comment: org.texttechnologylab.annotation.AnnotationComment
    legacy_lua_json:
      source_file: duui-py/examples/taxonerd-async/taxonerd_legacy_annotator.py
      codec: lua_custom_json
      request_parameters:
        model:
          type: string
          default: en_ner_eco_md
        linking:
          type: string
          default: gbif_backbone
        threshold:
          type: number
          default: 0.7
        exclude:
          type: list_string
          default:
            - tagger
            - parser
            - taxo_abbrev_detector
            - taxon_linker
            - pysbd_sentencizer
        prefer_gpu:
          type: boolean
          default: false
      procedure_knobs:
        runtime_preload:
          model:
            env: DUUI_TAXONERD_PRELOAD_MODEL
            default: en_ner_eco_md
          linker:
            env: DUUI_TAXONERD_PRELOAD_LINKER
            default: gbif_backbone
          threshold:
            env: DUUI_TAXONERD_PRELOAD_THRESHOLD
            default: 0.7
        response_comment_keys:
          - linking
          - value
          - propability
