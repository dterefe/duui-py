      default: 5.0

annotators:
  gazetteer:
    async_msgpack:
      source_file: duui-py/examples/gazetteer-async/gazetteer_annotator.py
      codec: msgpack_lua
      backend:
        binary:
          parameter: null
          env: null
          resolution_order:
            - duui-py/examples/gazetteer-async/backend/gazetteer
            - /app/gazetteer
        config_path:
          parameter: null
          env: null
          resolution_order:
            - duui-py/examples/gazetteer-async/backend/config.toml
            - /app/config.toml
        address:
          parameter: gazetteer_address
          env: GAZETTEER_RS_ADDRESS
          default: 127.0.0.1
        port:
          parameter: gazetteer_backend_port
          env: GAZETTEER_RS_PORT
          default: 18001
        workers:
          parameter: gazetteer_workers
          env: GAZETTEER_RS_WORKERS
          default: omitted
        limit:
          parameter: gazetteer_limit
          env: GAZETTEER_RS_LIMIT
          default: omitted
        ping_path:
          current: /v1/process
        startup_timeout_seconds:
          parameter: gazetteer_startup_timeout
          env: GAZETTEER_RS_STARTUP_TIMEOUT
          default: 120.0
        ready_status_codes:
          current: [405]
      request_parameters:
        backend_url:
          type: string
          default: null
          effect: use_remote_backend_instead_of_managed_local_backend
        timeout:
          type: number
          default: 120
          alias: timeout_seconds
        max_len:
          type: integer
          default: null
          forwarded_to_backend: true
        result_selection:
          type: string
          default: null
          forwarded_to_backend: true
        window_chars:
          type: integer
          default: 0
          effect: split_long_input_for_backend_queries
        window_overlap:
          type: integer
          default: 512
          effect: overlap_for_windowed_backend_queries
        backend_concurrency:
          type: integer
          default: 4
          effect: concurrent_window_backend_requests
      procedure_knobs:
        preannotation_pass_through:
          enabled: true
          trigger_type: org.texttechnologylab.annotation.type.Taxon
        deduplicate_window_results:
          enabled: true
          key_fields: [begin, end, match_strings, match_labels]
    legacy_lua_json:
      source_file: duui-py/examples/gazetteer-async/gazetteer_legacy_annotator.py
      codec: lua_custom_json
      backend:
        shared_with_async_msgpack: true
      request_parameters:
        max_len:
          type: integer
          default: null
          forwarded_to_backend: true
        result_selection:
          type: string
          default: null
          forwarded_to_backend: true
        timeout_seconds:
          type: number
          default: 120.0
      procedure_knobs:
        retry_count:
          type: integer
          env: DUUI_HTTP_RETRIES
          default: 2
        pool_timeout_seconds:
          type: number
          current: 120.0

  gnfinder:
