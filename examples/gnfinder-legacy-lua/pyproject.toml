[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gnfinder-legacy-lua"
version = "1.0.0"
description = "Legacy GNFinder XMI custom-Lua service migrated to duui-py"
requires-python = ">=3.10"
dependencies = ["duui-py", "uvicorn[standard]>=0.27.0", "dkpro-cassis>=0.9.1"]

[tool.setuptools]
py-modules = ["gnfinder_legacy_annotator"]
