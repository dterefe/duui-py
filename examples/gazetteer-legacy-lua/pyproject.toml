[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gazetteer-legacy-lua"
version = "1.5.4"
description = "Legacy gazetteer-rs BioFID custom-Lua service migrated to duui-py"
requires-python = ">=3.10"
dependencies = ["duui-py", "uvicorn[standard]>=0.27.0"]

[tool.setuptools]
py-modules = ["gazetteer_legacy_annotator"]
