[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taxonerd-legacy-lua"
version = "1.3.3"
description = "Legacy TTLab TaxoNERD custom-Lua service migrated to duui-py"
requires-python = ">=3.10"
dependencies = [
  "duui-py",
  "uvicorn[standard]>=0.27.0",
  "taxonerd",
  "pandas",
]

[tool.setuptools]
py-modules = ["taxonerd_legacy_annotator"]
